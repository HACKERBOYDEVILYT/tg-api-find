name: Run Telegram Bot

on:
  schedule:
    # প্রতি ১ ঘণ্টা পর পর রান করার জন্য (আপনার প্রয়োজনমতো সময় পরিবর্তন করতে পারেন)
    - cron: '0 * * * *'
  workflow_dispatch: # ম্যানুয়ালি রান করার অপশন

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    # গিটহাবে অফসেট ফাইল আপডেট বা কমিট করার জন্য পারমিশন
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run bot script
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python scripts/telegram_bot.py

      - name: Commit and push offset changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add data/telegram-offset.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update telegram offset [skip ci]" && git push)
